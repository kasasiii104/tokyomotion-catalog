name: Update TokyoMotion catalog

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'assets/language.mjs'
      - '.github/workflows/update-catalog.yml'
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-tokyomotion-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test parsers, accumulation, backfill and UI
        run: node --test tests/catalog.test.mjs
      - name: Fetch Japanese titles, 6 recent pages, 12 archive pages and up to 240 details
        run: node scripts/update.mjs
      - name: Commit changed catalog data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update TokyoMotion catalog"
          git pull --rebase origin main
          git push
