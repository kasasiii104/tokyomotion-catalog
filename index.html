<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TokyoMotion Catalog</title>
  <meta name="description" content="TokyoMotion公式埋め込みプレイヤーで見るメタデータカタログ">
  <style>
    :root{color-scheme:dark;--bg:#090b10;--panel:#11151d;--panel2:#171d28;--line:#283244;--text:#f1f5fb;--muted:#9aa7ba;--accent:#ff4d74;--accent2:#7c8cff;--shadow:0 18px 50px #0007}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% -10%,#263251 0,#090b10 38%),var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    a{color:inherit}.shell{width:min(1240px,calc(100% - 32px));margin:0 auto}.topbar{position:sticky;top:0;z-index:5;background:#090b10dd;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff12}.topbar-inner{min-height:72px;display:flex;gap:20px;align-items:center;justify-content:space-between}.brand{display:flex;gap:11px;align-items:center;text-decoration:none;font-weight:800;letter-spacing:.03em}.brand-mark{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(135deg,var(--accent),#ff9b52);color:#16070b;font-size:14px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.08em}.source-link{font-size:13px;color:var(--muted);text-decoration:none}.source-link:hover{color:var(--text)}main{padding:30px 0 70px}.intro{display:flex;gap:22px;justify-content:space-between;align-items:end;margin-bottom:24px}.intro h1{font-size:clamp(26px,4vw,42px);line-height:1.1;margin:0 0 8px;letter-spacing:-.04em}.intro p{margin:0;color:var(--muted);max-width:620px}.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid #ffffff1a;border-radius:999px;color:#ccd5e4;font-size:12px;margin-bottom:12px}.pill i{width:7px;height:7px;border-radius:50%;background:#69e3ae;box-shadow:0 0 0 4px #69e3ae18}.controls{display:grid;grid-template-columns:minmax(220px,1fr) 180px 180px auto;gap:10px;background:#11151dcc;border:1px solid var(--line);padding:12px;border-radius:16px;box-shadow:var(--shadow);margin-bottom:18px}.field{min-width:0;position:relative}.field input,.field select{width:100%;height:44px;background:var(--panel2);border:1px solid #364155;color:var(--text);border-radius:10px;padding:0 12px;font:inherit;outline:none}.field input:focus,.field select:focus{border-color:#8292ff;box-shadow:0 0 0 3px #8292ff25}.filter-button{height:44px;border:0;border-radius:10px;padding:0 16px;background:linear-gradient(135deg,var(--accent),#fa7966);color:#fff;font-weight:800;cursor:pointer}.filter-button:active{transform:translateY(1px)}.meta-row{display:flex;gap:14px;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px;margin:0 3px 14px}.meta-row strong{color:var(--text)}.status{min-height:22px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{min-width:0;position:relative;background:linear-gradient(180deg,#151b26,#10141c);border:1px solid #273144;border-radius:15px;overflow:hidden;cursor:pointer;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.card:hover{transform:translateY(-3px);border-color:#6273a8;box-shadow:0 16px 34px #0005}.thumb{aspect-ratio:16/10;background:linear-gradient(135deg,#1d2c49,#151a25);position:relative;overflow:hidden}.thumb img{display:block;width:100%;height:100%;object-fit:cover}.thumb-fallback{height:100%;display:grid;place-items:center;color:#7788aa;font-size:14px}.play{position:absolute;left:12px;bottom:12px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#090b10d9;color:#fff;box-shadow:0 5px 14px #0008}.play:after{content:"";margin-left:2px;border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}.fav{position:absolute;right:10px;top:10px;width:34px;height:34px;border:1px solid #ffffff24;border-radius:50%;background:#090b10bb;color:#d2d9e5;font-size:18px;cursor:pointer}.fav.active{color:#ff7d9b;border-color:#ff7d9b66}.card-body{padding:12px 13px 14px}.card-title{font-size:15px;line-height:1.35;font-weight:750;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:41px}.card-sub{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:9px}.tag{padding:3px 7px;border-radius:999px;background:#252f43;color:#bdc9dc}.empty{padding:46px 16px;text-align:center;border:1px dashed #3b465b;border-radius:16px;color:var(--muted);grid-column:1/-1}.error{color:#ffb1bd;background:#3d1721;border:1px solid #7d3143;padding:12px 14px;border-radius:12px;margin-bottom:16px}.footer{border-top:1px solid #ffffff12;padding:24px 0 36px;color:var(--muted);font-size:12px}.footer a{color:#d2d9e5}.modal{position:fixed;inset:0;z-index:20;background:#020308e8;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modal-card{width:min(960px,100%);max-height:calc(100vh - 36px);overflow:auto;background:#0d121b;border:1px solid #34405a;border-radius:18px;box-shadow:0 30px 90px #000b}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid #ffffff12}.modal-head h2{font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.close{width:36px;height:36px;border:1px solid #ffffff22;border-radius:50%;background:#1a2230;color:#fff;font-size:20px;cursor:pointer}.player-wrap{background:#000;aspect-ratio:16/9}.player-wrap iframe{display:block;width:100%;height:100%;border:0}.modal-foot{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 16px;color:var(--muted);font-size:13px}.modal-foot a{color:#fff}.skeleton{height:260px;border-radius:15px;background:linear-gradient(100deg,#141a24 20%,#202a3a 35%,#141a24 50%);background-size:200% 100%;animation:shimmer 1.3s infinite}@keyframes shimmer{to{background-position:-200% 0}}@media(max-width:980px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.controls{grid-template-columns:1fr 1fr}.filter-button{grid-column:1/-1}}@media(max-width:650px){.shell{width:min(100% - 22px,1240px)}.topbar-inner{min-height:62px}.source-link{display:none}.intro{display:block}.intro h1{font-size:30px}.controls{grid-template-columns:1fr;padding:10px}.filter-button{grid-column:auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card-body{padding:10px}.card-title{font-size:14px;min-height:38px}.modal{padding:8px}.modal-card{border-radius:12px}.modal-foot{display:block}.modal-foot a{display:inline-block;margin-top:5px}}
    .play-label{position:absolute;bottom:14px;left:58px;padding:4px 8px;border-radius:6px;background:#090b10d9;font-size:12px}.card:focus-visible{outline:2px solid #8292ff;outline-offset:3px}.catalog-status{font-size:12px;color:var(--muted);margin:12px 3px}.more-wrap{text-align:center;margin-top:24px}.more-wrap button{min-width:220px}.modal-stats{padding:0 16px 12px;margin:0}.player-status{padding:12px 16px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}.player-status p{margin:0 0 10px}.player-status button{background:#202a3a;color:#fff;border:1px solid #3b465b;border-radius:8px;padding:8px 12px;cursor:pointer}.filter-button:disabled{opacity:.6;cursor:wait}.meta-row{flex-wrap:wrap}.player-wrap{min-height:180px}.player-wrap .empty{height:100%;display:grid;align-content:center;border:0}.modal-card{max-height:calc(100dvh - 24px)}
  </style>
</head>
<body>
  <div class="topbar"><div class="shell topbar-inner"><a class="brand" href="./"><span class="brand-mark">TM</span><span>TokyoMotion <small>CATALOG</small></span></a><a class="source-link" href="https://www.tokyomotion.net/" target="_blank" rel="noopener">公式サイトを開く ↗</a></div></div>
  <main class="shell">
    <section class="intro"><div><span class="pill"><i></i>公式埋め込みプレイヤー対応</span><h1>作品を探して、サムネイルから再生</h1><p>一覧・検索・並び替えはこのカタログで。再生時だけTokyoMotionの公式プレイヤーを読み込みます。</p></div></section>
    <section class="controls" aria-label="検索と絞り込み"><label class="field"><input id="q" type="search" aria-label="タイトル・タグを検索" placeholder="タイトル・タグを検索" autocomplete="off"></label><label class="field"><select id="sort" aria-label="並び順"><option value="new">新着順</option><option value="old">古い順</option><option value="views">再生数順</option><option value="rating">評価順</option><option value="title">タイトル順</option></select></label><label class="field"><select id="category" aria-label="カテゴリ"><option value="">すべてのカテゴリ</option></select></label><button id="refresh" class="filter-button" type="button">更新</button></section>
    <div id="error" class="error" hidden></div><div class="meta-row"><span id="count" class="status">読み込み中…</span><span>動画本体は保存しません</span></div><section id="grid" class="grid" aria-live="polite"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></section>
    <div class="more-wrap"><button id="more" class="filter-button" type="button" hidden>さらに48件を表示</button></div><p id="catalog-status" class="catalog-status"></p>
  </main>
  <footer class="footer"><div class="shell">TokyoMotionの作品情報を表示する個人向けカタログです。再生は公式プレイヤーを使用します。<br><a href="https://www.tokyomotion.net/" target="_blank" rel="noopener">TokyoMotion</a> ・ <a href="https://www.tokyomotion.net/static/terms" target="_blank" rel="noopener">公式利用規約</a></div></footer>
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-card"><div class="modal-head"><h2 id="modal-title">公式プレイヤー</h2><button id="close" class="close" type="button" aria-label="閉じる">×</button></div><div id="viewer-stats" class="card-sub modal-stats"></div><div id="player" class="player-wrap"><div class="empty">プレイヤーを準備しています…</div></div><div class="player-status"><p id="player-status" role="status"></p><button id="retry-player" type="button">プレイヤーを再読み込み</button></div><div class="modal-foot"><span>TokyoMotion公式埋め込みプレイヤー</span><a id="source" href="https://www.tokyomotion.net/" target="_blank" rel="noopener">作品ページを公式サイトで開く ↗</a></div></div></div>
  <script>
    const $=id=>document.getElementById(id);
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function stored(key){try{const value=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(value)?value:[]}catch{return []}}
    const state={items:[],byId:new Map(),favorites:new Set(stored('tm-favorites')),history:stored('tm-history'),limit:48,data:null,activeId:null,returnFocus:null,timer:null};
    function save(){try{localStorage.setItem('tm-favorites',JSON.stringify([...state.favorites]));localStorage.setItem('tm-history',JSON.stringify(state.history.slice(0,30)))}catch{}}
    const number=value=>typeof value==='number'&&Number.isFinite(value)&&value>=0;
    const countLabel=value=>number(value)?value.toLocaleString('ja-JP'):'未取得';
    function safeUrl(value,kind){try{const u=new URL(value);if(u.protocol!=='https:'||u.username||u.password)return '';if(kind==='image')return /(^|\.)(tokyomotion|tokyo-motion)\.net$/i.test(u.hostname)?u.href:'';if(u.hostname!=='www.tokyomotion.net'&&u.hostname!=='tokyomotion.net')return '';return kind==='embed'&& !/^\/embed\/[A-Za-z0-9_-]+$/.test(u.pathname)?'':u.href}catch{return ''}}
    function ratingValue(x){if(x.statsVersion===2&&number(x.likes)&&number(x.dislikes)){if(x.likes+x.dislikes>0)return 100*x.likes/(x.likes+x.dislikes);return -1}if(number(x.ratingPercent)&&x.ratingPercent<=100)return x.ratingPercent;return -1}
    function stats(x){const verified=x.statsVersion===2||!!x.listingCheckedAt;const views=verified&&number(x.views)?countLabel(x.views)+'回再生':'再生数 未取得';const rating=ratingValue(x);const votes=x.statsVersion===2&&number(x.likes)&&number(x.dislikes)?'高評価 '+countLabel(x.likes)+' / 低評価 '+countLabel(x.dislikes):'';return '<span>'+esc(views)+'</span><span title="'+esc(votes||'公式掲載値')+'">'+(rating>=0?'評価 '+Math.round(rating)+'%':votes?esc(votes):'評価 未取得')+'</span>'}
    function filtered(){const q=$('q').value.trim().toLowerCase(),cat=$('category').value,sort=$('sort').value;const out=state.items.filter(x=>(!q||[x.title,...x.categories].join(' ').toLowerCase().includes(q))&&(!cat||x.categories.includes(cat)));out.sort((a,b)=>sort==='title'?a.title.localeCompare(b.title,'ja'):sort==='views'?(b.views??-1)-(a.views??-1):sort==='rating'?ratingValue(b)-ratingValue(a):sort==='old'?(a.date||0)-(b.date||0)||Number(a.videoId)-Number(b.videoId):(b.date||0)-(a.date||0)||Number(b.videoId)-Number(a.videoId));return out}
    function card(x){const id=x.id,image=safeUrl(x.image,'image'),approx=x.dateSource==='relative'?'頃':'';return '<article class="card" tabindex="0" data-card="'+esc(id)+'" aria-label="公式ビューアーを開く"><div class="thumb">'+(image?'<img src="'+esc(image)+'" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">':'<div class="thumb-fallback">サムネイル未取得</div>')+'<span class="play" aria-hidden="true"></span><span class="play-label">公式再生</span><button class="fav '+(state.favorites.has(id)?'active':'')+'" data-fav="'+esc(id)+'" type="button" aria-label="お気に入り" aria-pressed="'+state.favorites.has(id)+'">'+(state.favorites.has(id)?'♥':'♡')+'</button></div><div class="card-body"><div class="card-title">'+esc(x.title||'タイトル未取得')+'</div><div class="card-sub">'+stats(x)+'</div><div class="card-sub"><span>'+esc(x.dateLabel||'日付不明')+approx+'</span>'+x.categories.slice(0,2).map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div></div></article>'}
    function render(){const list=filtered(),visible=list.slice(0,state.limit);$('count').innerHTML='<strong>'+list.length.toLocaleString('ja-JP')+'</strong> 件 · '+visible.length+'件を表示';$('grid').innerHTML=list.length?visible.map(card).join(''):'<div class="empty">条件に一致する作品がありません。</div>';$('more').hidden=visible.length>=list.length;$('more').textContent='さらに48件を表示';const data=state.data;if(data){const updated=data.updatedAt?new Date(data.updatedAt).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}):'未更新';$('catalog-status').textContent='最終取得 '+updated+'（日本時間）'+(data.backfill?' · 過去ページ '+(data.backfill.complete?'巡回完了':'次回 '+data.backfill.nextPage+'ページ目から'):'');}document.querySelectorAll('.thumb img').forEach(img=>{const fallback=()=>{const el=document.createElement('div');el.className='thumb-fallback';el.textContent='画像を読み込めません';img.replaceWith(el)};img.addEventListener('error',fallback,{once:true});if(img.complete&&!img.naturalWidth)fallback()})}
    async function load(){const oldCategory=$('category').value;$('refresh').disabled=true;$('error').hidden=true;try{const res=await fetch('data/videos.json?ts='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('カタログの読み込みに失敗しました（HTTP '+res.status+'）');const data=await res.json();if(!Array.isArray(data.items))throw new Error('カタログデータの形式が不正です');state.data=data;state.items=data.items.map(x=>({...x,id:String(x.id),title:String(x.title||''),categories:Array.isArray(x.categories)?x.categories:[]}));state.byId=new Map(state.items.map(x=>[x.id,x]));const cats=[...new Set(state.items.flatMap(x=>x.categories))].sort((a,b)=>a.localeCompare(b,'ja'));$('category').innerHTML='<option value="">すべてのカテゴリ</option>'+cats.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');if(cats.includes(oldCategory))$('category').value=oldCategory;render();if(data.errors?.length||data.updatedAt&&Date.now()-Date.parse(data.updatedAt)>3*3600000){$('error').textContent='取得の遅延または一部の取得失敗があります。表示中の情報は最終取得時点のものです。';$('error').hidden=false}}catch(e){$('error').textContent=e.message;$('error').hidden=false;if(!state.items.length){$('count').textContent='読み込みに失敗';$('grid').innerHTML='<div class="empty">更新ボタンで再読み込みできます。</div>'}}finally{$('refresh').disabled=false}}
    function loadPlayer(x){clearTimeout(state.timer);$('player').replaceChildren();$('player-status').textContent='公式プレイヤーを読み込んでいます…';const url=safeUrl(x.embedUrl,'embed');if(!url||['unavailable','not_found'].includes(x.availability)){$('player').innerHTML='<div class="empty">公式埋め込みが未取得、または公式ページを利用できません。</div>';$('player-status').textContent='下の公式作品ページから公開状態を確認できます。';return}const iframe=document.createElement('iframe');iframe.src=url;iframe.title='TokyoMotion公式プレイヤー';iframe.allow='autoplay; fullscreen; picture-in-picture; encrypted-media';iframe.allowFullscreen=true;iframe.referrerPolicy='strict-origin-when-cross-origin';iframe.addEventListener('load',()=>{clearTimeout(state.timer);$('player-status').textContent='公式プレイヤー枠を表示中。映像が出ない場合は再読み込み、または公式作品ページをご確認ください。'},{once:true});$('player').append(iframe);state.timer=setTimeout(()=>{$('player-status').textContent='読み込みに時間がかかっています。公式側の非公開・アクセス制限はこのサイトでは解除できません。'},12000)}
    function openPreview(id){const x=state.byId.get(id);if(!x)return;state.activeId=id;state.returnFocus=document.activeElement;$('modal-title').textContent=x.title||'公式プレイヤー';$('viewer-stats').innerHTML=stats(x);$('source').href=safeUrl(x.sourceUrl,'source')||'https://www.tokyomotion.net/';$('modal').classList.add('open');document.body.style.overflow='hidden';$('close').focus();state.history=[id,...state.history.filter(v=>v!==id)];save();loadPlayer(x)}
    function closePreview(){clearTimeout(state.timer);$('modal').classList.remove('open');$('player').replaceChildren();document.body.style.overflow='';state.activeId=null;if(state.returnFocus?.isConnected)state.returnFocus.focus()}
    $('grid').addEventListener('click',e=>{const fav=e.target.closest('[data-fav]');if(fav){const id=fav.dataset.fav;state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);save();fav.classList.toggle('active',state.favorites.has(id));fav.textContent=state.favorites.has(id)?'♥':'♡';fav.setAttribute('aria-pressed',state.favorites.has(id));return}const card=e.target.closest('[data-card]');if(card)openPreview(card.dataset.card)});
    $('grid').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-card]')){e.preventDefault();openPreview(e.target.dataset.card)}});
    let searchTimer;$('q').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.limit=48;render()},120)});
    ['sort','category'].forEach(id=>$(id).addEventListener('change',()=>{state.limit=48;render()}));
    $('more').addEventListener('click',()=>{state.limit+=48;render()});$('refresh').addEventListener('click',load);$('close').addEventListener('click',closePreview);
    $('retry-player').addEventListener('click',()=>{const x=state.byId.get(state.activeId);if(x)loadPlayer(x)});
    $('modal').addEventListener('click',e=>{if(e.target===$('modal'))closePreview()});
    document.addEventListener('keydown',e=>{if(!state.activeId)return;if(e.key==='Escape')closePreview();if(e.key==='Tab'){const first=$('close'),last=$('source');if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
    load();
  </script>
</body>
</html>
