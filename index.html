<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TokyoMotion Catalog</title>
  <meta name="description" content="TokyoMotion公式埋め込みプレイヤーで見るメタデータカタログ">
  <style>
    :root{color-scheme:dark;--bg:#090b10;--panel:#11151d;--panel2:#171d28;--line:#283244;--text:#f1f5fb;--muted:#9aa7ba;--accent:#ff4d74;--accent2:#7c8cff;--shadow:0 18px 50px #0007}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% -10%,#263251 0,#090b10 38%),var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    a{color:inherit}.shell{width:min(1240px,calc(100% - 32px));margin:0 auto}.topbar{position:sticky;top:0;z-index:5;background:#090b10dd;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff12}.topbar-inner{min-height:72px;display:flex;gap:20px;align-items:center;justify-content:space-between}.brand{display:flex;gap:11px;align-items:center;text-decoration:none;font-weight:800;letter-spacing:.03em}.brand-mark{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(135deg,var(--accent),#ff9b52);color:#16070b;font-size:14px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.08em}.source-link{font-size:13px;color:var(--muted);text-decoration:none}.source-link:hover{color:var(--text)}main{padding:30px 0 70px}.intro{display:flex;gap:22px;justify-content:space-between;align-items:end;margin-bottom:24px}.intro h1{font-size:clamp(26px,4vw,42px);line-height:1.1;margin:0 0 8px;letter-spacing:-.04em}.intro p{margin:0;color:var(--muted);max-width:620px}.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid #ffffff1a;border-radius:999px;color:#ccd5e4;font-size:12px;margin-bottom:12px}.pill i{width:7px;height:7px;border-radius:50%;background:#69e3ae;box-shadow:0 0 0 4px #69e3ae18}.controls{display:grid;grid-template-columns:minmax(220px,1fr) 180px 180px auto;gap:10px;background:#11151dcc;border:1px solid var(--line);padding:12px;border-radius:16px;box-shadow:var(--shadow);margin-bottom:18px}.field{min-width:0;position:relative}.field input,.field select{width:100%;height:44px;background:var(--panel2);border:1px solid #364155;color:var(--text);border-radius:10px;padding:0 12px;font:inherit;outline:none}.field input:focus,.field select:focus{border-color:#8292ff;box-shadow:0 0 0 3px #8292ff25}.filter-button{height:44px;border:0;border-radius:10px;padding:0 16px;background:linear-gradient(135deg,var(--accent),#fa7966);color:#fff;font-weight:800;cursor:pointer}.filter-button:active{transform:translateY(1px)}.meta-row{display:flex;gap:14px;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px;margin:0 3px 14px}.meta-row strong{color:var(--text)}.status{min-height:22px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{min-width:0;position:relative;background:linear-gradient(180deg,#151b26,#10141c);border:1px solid #273144;border-radius:15px;overflow:hidden;cursor:pointer;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.card:hover{transform:translateY(-3px);border-color:#6273a8;box-shadow:0 16px 34px #0005}.thumb{aspect-ratio:16/10;background:linear-gradient(135deg,#1d2c49,#151a25);position:relative;overflow:hidden}.thumb img{display:block;width:100%;height:100%;object-fit:cover}.thumb-fallback{height:100%;display:grid;place-items:center;color:#7788aa;font-size:14px}.play{position:absolute;left:12px;bottom:12px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#090b10d9;color:#fff;box-shadow:0 5px 14px #0008}.play:after{content:"";margin-left:2px;border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}.fav{position:absolute;right:10px;top:10px;width:34px;height:34px;border:1px solid #ffffff24;border-radius:50%;background:#090b10bb;color:#d2d9e5;font-size:18px;cursor:pointer}.fav.active{color:#ff7d9b;border-color:#ff7d9b66}.card-body{padding:12px 13px 14px}.card-title{font-size:15px;line-height:1.35;font-weight:750;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:41px}.card-sub{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:9px}.tag{padding:3px 7px;border-radius:999px;background:#252f43;color:#bdc9dc}.empty{padding:46px 16px;text-align:center;border:1px dashed #3b465b;border-radius:16px;color:var(--muted);grid-column:1/-1}.error{color:#ffb1bd;background:#3d1721;border:1px solid #7d3143;padding:12px 14px;border-radius:12px;margin-bottom:16px}.footer{border-top:1px solid #ffffff12;padding:24px 0 36px;color:var(--muted);font-size:12px}.footer a{color:#d2d9e5}.modal{position:fixed;inset:0;z-index:20;background:#020308e8;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modal-card{width:min(960px,100%);max-height:calc(100vh - 36px);overflow:auto;background:#0d121b;border:1px solid #34405a;border-radius:18px;box-shadow:0 30px 90px #000b}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid #ffffff12}.modal-head h2{font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.close{width:36px;height:36px;border:1px solid #ffffff22;border-radius:50%;background:#1a2230;color:#fff;font-size:20px;cursor:pointer}.player-wrap{background:#000;aspect-ratio:16/9}.player-wrap iframe{display:block;width:100%;height:100%;border:0}.modal-foot{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 16px;color:var(--muted);font-size:13px}.modal-foot a{color:#fff}.age{position:fixed;inset:0;z-index:30;background:#060810f2;display:grid;place-items:center;padding:20px}.age.hidden{display:none}.age-card{max-width:500px;background:#111722;border:1px solid #36435e;border-radius:18px;padding:26px;box-shadow:var(--shadow)}.age-card h2{margin:0 0 8px;font-size:24px}.age-card p{color:var(--muted);margin:0 0 18px}.age-card button{width:100%;height:44px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--accent),#fa7966);color:#fff;font-weight:800;cursor:pointer}.skeleton{height:260px;border-radius:15px;background:linear-gradient(100deg,#141a24 20%,#202a3a 35%,#141a24 50%);background-size:200% 100%;animation:shimmer 1.3s infinite}@keyframes shimmer{to{background-position:-200% 0}}@media(max-width:980px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.controls{grid-template-columns:1fr 1fr}.filter-button{grid-column:1/-1}}@media(max-width:650px){.shell{width:min(100% - 22px,1240px)}.topbar-inner{min-height:62px}.source-link{display:none}.intro{display:block}.intro h1{font-size:30px}.controls{grid-template-columns:1fr;padding:10px}.filter-button{grid-column:auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card-body{padding:10px}.card-title{font-size:14px;min-height:38px}.modal{padding:8px}.modal-card{border-radius:12px}.modal-foot{display:block}.modal-foot a{display:inline-block;margin-top:5px}}
  </style>
</head>
<body>
  <div class="topbar"><div class="shell topbar-inner"><a class="brand" href="./"><span class="brand-mark">TM</span><span>TokyoMotion <small>CATALOG</small></span></a><a class="source-link" href="https://www.tokyomotion.net/" target="_blank" rel="noopener">公式サイトを開く ↗</a></div></div>
  <main class="shell">
    <section class="intro"><div><span class="pill"><i></i>公式埋め込みプレイヤー対応</span><h1>作品を探して、サムネイルから再生</h1><p>一覧・検索・並び替えはこのカタログで。再生時だけTokyoMotionの公式プレイヤーを読み込みます。</p></div></section>
    <section class="controls" aria-label="検索と絞り込み"><label class="field"><input id="q" type="search" placeholder="タイトル・タグを検索" autocomplete="off"></label><label class="field"><select id="sort" aria-label="並び順"><option value="new">新着順</option><option value="old">古い順</option><option value="title">タイトル順</option></select></label><label class="field"><select id="category" aria-label="カテゴリ"><option value="">すべてのカテゴリ</option></select></label><button id="refresh" class="filter-button" type="button">更新</button></section>
    <div id="error" class="error" hidden></div><div class="meta-row"><span id="count" class="status">読み込み中…</span><span>動画本体は保存しません</span></div><section id="grid" class="grid" aria-live="polite"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></section>
  </main>
  <footer class="footer"><div class="shell">TokyoMotionの作品情報を表示する個人向けカタログです。再生は公式プレイヤーを使用します。<br><a href="https://www.tokyomotion.net/" target="_blank" rel="noopener">TokyoMotion</a> ・ <a href="https://www.tokyomotion.net/static/terms" target="_blank" rel="noopener">公式利用規約</a></div></footer>
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-card"><div class="modal-head"><h2 id="modal-title">公式プレイヤー</h2><button id="close" class="close" type="button" aria-label="閉じる">×</button></div><div id="player" class="player-wrap"><div class="empty">プレイヤーを準備しています…</div></div><div class="modal-foot"><span>TokyoMotion公式埋め込みプレイヤー</span><a id="source" href="https://www.tokyomotion.net/" target="_blank" rel="noopener">作品ページを公式サイトで開く ↗</a></div></div></div>
  <script>
    const state={items:[],favorites:new Set(JSON.parse(localStorage.getItem('tm-favorites')||'[]')),history:JSON.parse(localStorage.getItem('tm-history')||'[]')};
    const $=id=>document.getElementById(id);
    const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const save=()=>{localStorage.setItem('tm-favorites',JSON.stringify([...state.favorites]));localStorage.setItem('tm-history',JSON.stringify(state.history.slice(0,30)))};
    function filtered(){const q=$('q').value.trim().toLowerCase(),cat=$('category').value,sort=$('sort').value;let out=state.items.filter(x=>(!q||[x.title,...x.categories].join(' ').toLowerCase().includes(q))&&(!cat||x.categories.includes(cat)));out.sort((a,b)=>sort==='title'?a.title.localeCompare(b.title,'ja'):(sort==='old'?a.date-b.date:b.date-a.date));return out}
    function render(){const list=filtered();$('count').innerHTML='<strong>'+list.length+'</strong> 件 · 公式ページから取得';$('grid').innerHTML=list.length?list.map(x=>card(x.id)).join(''):'<div class="empty">条件に一致する作品がありません。検索語やカテゴリを変えてください。</div>';document.querySelectorAll('[data-card]').forEach(el=>el.addEventListener('click',()=>openPreview(el.dataset.card)));document.querySelectorAll('[data-fav]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();const id=el.dataset.fav;state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);save();render()}));document.querySelectorAll('.thumb img').forEach(img=>img.addEventListener('error',()=>{const fallback=document.createElement('div');fallback.className='thumb-fallback';fallback.textContent='サムネイルなし';img.replaceWith(fallback)},{once:true}))}
    function card(id){const x=state.items.find(v=>v.id===id);const views=x.views==null?'':'<span>再生 '+Number(x.views).toLocaleString('ja-JP')+'回</span>';const votes=x.likes==null&&x.dislikes==null?'':'<span>評価 +'+Number(x.likes||0).toLocaleString('ja-JP')+' / -'+Number(x.dislikes||0).toLocaleString('ja-JP')+'</span>';return '<article class="card" data-card="'+esc(id)+'"><div class="thumb">'+(x.image?'<img src="'+esc(x.image)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':'<div class="thumb-fallback">サムネイルなし</div>')+'<span class="play" aria-hidden="true"></span><button class="fav '+(state.favorites.has(id)?'active':'')+'" data-fav="'+esc(id)+'" aria-label="お気に入り">'+(state.favorites.has(id)?'♥':'♡')+'</button></div><div class="card-body"><div class="card-title">'+esc(x.title||'タイトルなし')+'</div><div class="card-sub"><span>'+esc(x.dateLabel||'日付不明')+'</span>'+views+votes+x.categories.slice(0,2).map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div></div></article>'}
    async function load(){ $('error').hidden=true;$('grid').innerHTML='<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';try{const res=await fetch('data/videos.json?ts='+Date.now(),{cache:'no-store'});const data=await res.json();if(!Array.isArray(data.items))throw new Error('カタログデータの形式が不正です');state.items=data.items||[];const cats=[...new Set(state.items.flatMap(x=>x.categories))].sort((a,b)=>a.localeCompare(b,'ja'));$('category').innerHTML='<option value="">すべてのカテゴリ</option>'+cats.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');render()}catch(e){$('count').textContent='読み込みに失敗';$('grid').innerHTML='<div class="empty">RSSを取得できませんでした。時間を置いて更新してください。</div>';$('error').textContent=e.message;$('error').hidden=false}}
    async function openPreview(id){const x=state.items.find(v=>v.id===id);if(!x)return;$('modal-title').textContent=x.title||'公式プレイヤー';$('source').href=x.sourceUrl||'https://www.tokyomotion.net/';$('player').innerHTML='<div class="empty">公式プレイヤーを準備しています…</div>';$('modal').classList.add('open');document.body.style.overflow='hidden';state.history=[id,...state.history.filter(v=>v!==id)];save();try{const embed=x.embedUrl;if(!embed)throw new Error('この作品の公式埋め込みURLがまだ登録されていません');$('player').innerHTML='<iframe src="'+esc(embed)+'" title="TokyoMotion公式プレイヤー" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>'}catch(e){$('player').innerHTML='<div class="empty">'+esc(e.message)+'<br><a href="'+esc(x.sourceUrl)+'" target="_blank" rel="noopener">TokyoMotionで開く ↗</a></div>'}}
    function closePreview(){$('modal').classList.remove('open');$('player').innerHTML='';document.body.style.overflow=''}
    $('q').addEventListener('input',render);$('sort').addEventListener('change',render);$('category').addEventListener('change',render);$('refresh').addEventListener('click',load);$('close').addEventListener('click',closePreview);$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closePreview()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePreview()});load();
  </script>
</body>
</html>
