<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#101010">
  <title>MOTION | 日本語カタログ</title>
  <link rel="stylesheet" href="assets/site.css?v=20261008-content1">
</head>
<body>
  <a class="skip-link" href="#main">作品一覧へ</a>
  <header class="topbar">
    <button class="icon-button menu-button" id="menu-toggle" aria-label="メニューを開く" aria-expanded="false" aria-controls="sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <a class="brand" href="./" aria-label="MOTION ホーム"><span class="brand-mark" aria-hidden="true">M</span><span>MOTION<small>日本語カタログ</small></span></a>
    <form class="search" id="search-form" role="search"><input id="q" type="search" placeholder="作品を検索" aria-label="タイトル・タグを検索" autocomplete="off"><button aria-label="検索" type="submit"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button></form>
    <span class="language-badge">日本語のみ</span>
    <button class="icon-button" id="refresh" aria-label="一覧を更新" title="一覧を更新"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M5.5 7a7.5 7.5 0 0 1 12.4-1L20 9M4 15l2.1 3A7.5 7.5 0 0 0 18.5 17"/></svg></button>
  </header>
  <button id="nav-backdrop" class="nav-backdrop" aria-label="メニューを閉じる" hidden></button>
  <aside class="sidebar" id="sidebar" aria-label="メインメニュー">
    <nav>
      <button data-view="home" class="nav-item active"><span aria-hidden="true">⌂</span>ホーム</button>
      <button data-view="recent" class="nav-item"><span aria-hidden="true">◷</span>新着</button>
      <button data-view="popular" class="nav-item"><span aria-hidden="true">↗</span>人気の作品</button>
      <button data-view="rated" class="nav-item"><span aria-hidden="true">☆</span>高評価</button>
      <button data-view="archive" class="nav-item"><span aria-hidden="true">▤</span>過去の作品</button>
      <div class="nav-divider"></div><p class="nav-label">マイライブラリ</p>
      <button data-view="favorites" class="nav-item"><span aria-hidden="true">♡</span>お気に入り</button>
      <button data-view="history" class="nav-item"><span aria-hidden="true">↶</span>再生履歴</button>
    </nav>
    <div class="sidebar-note"><span class="status-dot"></span> 日本語タイトルを収集<p>新着も、過去の作品も。</p></div>
  </aside>
  <main id="main">
    <div id="browse-view">
    <nav class="chips" aria-label="表示切り替え"><button data-view="home" class="chip active">すべて</button><button data-view="recent" class="chip">新着</button><button data-view="popular" class="chip">人気</button><button data-view="rated" class="chip">高評価</button><button data-view="archive" class="chip">過去の作品</button><button data-view="favorites" class="chip">お気に入り</button><button data-view="history" class="chip">再生履歴</button></nav>
        <div id="notice" class="notice" role="status" hidden></div>
    <section id="shelf-section" class="shelf-section" aria-labelledby="shelf-title"><div class="section-head"><h2 id="shelf-title">いま人気の作品</h2><button id="all-popular" class="text-button">すべて見る <span aria-hidden="true">›</span></button></div><div class="shelf" id="shelf"></div></section>
    <section class="catalog-section" aria-labelledby="section-title"><div class="section-head catalog-head"><div><h2 id="section-title">新着の作品</h2><p id="count" class="count" aria-live="polite">読み込み中…</p></div><div class="filters"><label><span class="sr-only">カテゴリ</span><select id="category"><option value="">すべてのカテゴリ</option></select></label><label><span class="sr-only">並び順</span><select id="sort"><option value="new">新しい順</option><option value="old">古い順</option><option value="views">再生数順</option><option value="rating">高評価順</option><option value="title">タイトル順</option></select></label></div></div><div id="grid" class="grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div><div class="more-wrap"><button id="more" class="more-button" hidden>さらに36件を表示 <span aria-hidden="true">⌄</span></button></div></section>
    </div>
    <section id="watch-view" class="watch-view" aria-labelledby="watch-title" hidden>
      <div class="watch-toolbar"><button id="watch-back" class="secondary-button">← 一覧に戻る</button><span>公式埋め込みプレイヤー</span></div>
      <div id="watch-media" class="watch-media"></div>
      <div class="watch-feedback"><p id="watch-status" role="status"></p><button id="watch-retry" class="text-button">再読み込み</button></div>
      <h1 id="watch-title"></h1><div id="watch-info"></div>
    </section>
    <footer><p id="catalog-status"></p><p>画像プレビューは公式サムネイルの連続表示です。本編は公式埋め込みで再生します。素材や作品の公開状態により利用できない場合があります。</p><span class="footer-brand">MOTION</span></footer>
  </main>
  <dialog id="details" class="details-dialog" aria-labelledby="detail-title"><button id="detail-close" class="detail-close" aria-label="詳細を閉じる">×</button><div id="detail-content"></div></dialog>
  <noscript><p class="notice">作品一覧の表示にはJavaScriptを有効にしてください。</p></noscript>
  <script type="module" src="assets/app.mjs?v=20261008-content1"></script>
</body>
</html>
